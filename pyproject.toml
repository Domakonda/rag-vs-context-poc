[project]
name = "ragchat"
version = "0.1.0"
description = "Local chat POC comparing RAG vs full-context answers (Streamlit + OpenAI + ChromaDB)"
authors = [
    { name = "Aravind Domakonda", email = "aravind.domakonda@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "openai>=3.46.0",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
ragchat = "ragchat:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
